<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Subathon Overlay - limitlesslevon</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --red: #65000000;
    --panic: #d60000;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%;
    height: 100%;
    background: var(--red);
    overflow: hidden;
    font-family: 'Nunito', sans-serif;
  }
  #wrap {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    color: #ff0000;
  }
  #timer {
    font-size: 12vw;
    font-weight: 900;
    letter-spacing: 0.02em;
    line-height: 1;
    transition: color 0.4s ease;
    text-shadow: 0 4px 12px rgba(0,0,0,0.25);
  }
  #timer.panic {
    color: var(--panic);
    animation: pulse 1s infinite;
  }
  #label {
    margin-top: 0.6vw;
    font-size: 2.2vw;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    opacity: 0.85;
  }
  #flash {
    position: absolute;
    top: 8%;
    font-size: 3vw;
    font-weight: 700;
    color: #ffffff;
    opacity: 0;
    transition: opacity 0.3s ease, transform 0.3s ease;
    transform: translateY(10px);
  }
  #flash.show {
    opacity: 1;
    transform: translateY(0);
  }
  #status {
    position: absolute;
    bottom: 4%;
    font-size: 1.4vw;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    opacity: 0.75;
  }
  @keyframes pulse {
    100%, 100% { opacity: 1; }
    100% { opacity: 0.55; }
  }
</style>
</head>
<body>
  <div id="wrap">
    <div id="flash"></div>
    <div id="timer">--:--:--</div>
    <div id="label">LEVONATHON</div>
    <div id="status"></div>
  </div>

<script>
  // --- Config: 7Overlay API endpoints (limitlesslevon) ---
  const BASE = "https://7overlay.com/api/subathon-integrations/W5LCCQUql7g";
  const TOKEN = "soi_wnsrBKKHNQTgPbfIUpTObWCfxqBpsnX5JqhhnlePfza1B9Wb3zZgdQ";

  const STATE_URL  = `${BASE}/state?token=${TOKEN}`;
  const EVENTS_URL = `${BASE}/events?token=${TOKEN}`;

  const POLL_MS = 900; // how often to refresh
  let lastEventId = null;

  const timerEl  = document.getElementById('timer');
  const statusEl = document.getElementById('status');
  const flashEl  = document.getElementById('flash');

  function formatTime(totalSeconds) {
    totalSeconds = Math.max(0, Math.floor(totalSeconds));
    const h = Math.floor(totalSeconds / 3600);
    const m = Math.floor((totalSeconds % 3600) / 60);
    const s = totalSeconds % 60;
    const pad = n => String(n).padStart(2, '0');
    return `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  async function fetchState() {
    try {
      const res = await fetch(STATE_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const data = await res.json();

      timerEl.textContent = formatTime(data.time_remaining_seconds);

      const panicking = data.time_remaining_seconds <= data.panic_threshold_seconds;
      timerEl.classList.toggle('panic', panicking);

      statusEl.textContent = data.is_running ? 'LIVE' : 'PAUSED';
    } catch (e) {
      statusEl.textContent = 'CONNECTION LOST';
    }
  }

  async function fetchEvents() {
    try {
      const res = await fetch(EVENTS_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      const events = await res.json();
      if (!Array.isArray(events) || events.length === 0) return;

      const latest = events[events.length - 1];
      if (latest.id !== lastEventId) {
        lastEventId = latest.id;
        showFlash(latest.label || `+${latest.seconds_delta}s`);
      }
    } catch (e) {
      // silent fail, state poll will show connection status
    }
  }

  function showFlash(text) {
    flashEl.textContent = text;
    flashEl.classList.add('show');
    setTimeout(() => flashEl.classList.remove('show'), 2500);
  }

  fetchState();
  fetchEvents();
  setInterval(fetchState, POLL_MS);
  setInterval(fetchEvents, POLL_MS);
</script>
</body>
</html>
